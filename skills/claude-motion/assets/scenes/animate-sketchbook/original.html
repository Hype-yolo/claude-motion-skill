<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  SKETCHBOOK DEMO — 9:16, 6.0s @ 120 BPM, 24fps. A puzzled doodle gets an idea: a lightbulb is pencilled in,
//  inked and scribbled yellow; the bulb becomes the sun over a sketched hill, and the hero waves from the top.
//  Proves the style kit renders, morphs and stays deterministic.
//  Build: node <skill>/tools/build.mjs <skill>/styles/sketchbook/demo
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = 6.0;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
const CX = 500;

const ERA_LIST = [[0, 3, () => sceneIdea()], [3, 6, () => sceneHill()]];
const SHOTS = [
  ['idea', 0, 0.0, 3.0, 'a puzzled doodle; a lightbulb is pencilled in, inked, scribbled yellow'],
  ['hill', 1, 3.0, 6.0, 'the bulb becomes the sun over a sketched hill; the hero waves from the top'],
];
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOTS.map(([key, era, t0, t1, title], i) => ({ id: i + 1, key, era, t0, t1, title })),
  cuts: [],
  morphs: [3.0],
  cues: { draw: 0.5, ink: 1.25, fill: 1.5, pop: 2.0, rays: 3.5, house: 3.5, tree: 3.75, hop1: 4.5, hop2: 5.0 },
  acts: [
    { name: '1 Idea', role: 'build', t0: 0.0, t1: 3.0 },
    { name: '2 Hill', role: 'gift', t0: 3.0, t1: 6.0 },
  ],
  board: [
    { t: 1.75, title: 'the bulb is scribbled in', sound: 'pencil scratches on 16ths', next: 'it lights; the bulb becomes the sun' },
    { t: 5.0, title: 'the sun over the hill', sound: 'warm pad, plucks on the hops', next: 'loops' },
  ],
  narration: [],
};
window.TIMELINE = TIMELINE;
// =====================================================================
//  kit/core.js — seeded RNG, math, easing, palette, geometry, the hand-drawn drawing kit
//  (wobble on the boil, ink, paint, hatch, pencil, stipple, grain), cameras, mono text.
//  Needs from the piece head: FPS, W, H. Render state: ctx, F (frame), B (boil = floor(F/2)).
// =====================================================================

// ---------------------------------------------------------------------
//  seeded RNG
// ---------------------------------------------------------------------
function mulberry32(a) {

    f,

    i: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(f() * arr.length)],

// ---------------------------------------------------------------------
//  math
// ---------------------------------------------------------------------
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
// has absolute time t reached cut time c? (cuts snap to the nearest frame, like shot boundaries)
const past = (t, c) => Math.round(t * FPS + 1e-6) >= Math.round(c * FPS);
const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
const EZ = {
  o2: (t) => 1 - (1 - clamp(t)) ** 2,
  o3: (t) => 1 - (1 - clamp(t)) ** 3,
  i2: (t) => clamp(t) ** 2,
  i3: (t) => clamp(t) ** 3,
  io: (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2; },

// ---------------------------------------------------------------------
//  render state
// ---------------------------------------------------------------------
let ctx = null;   // current 2d context
let F = 0;        // absolute frame index
let B = 0;        // boil index — reseeds every 2 frames (Math.floor(t*12))

const C = {
  ink: '#3a2417', cream: '#efe5cf', paper: '#f4ecd9', paperLine: 'rgba(90,130,190,0.32)',
  orange: '#e58a4e', orangeD: '#c3622e', orangeL: '#f4b27c', terra: '#d97757',
  rose: '#d98b8b', roseD: '#b0616a', roseL: '#efb9b0',
  wood: '#d6a466', woodD: '#a8773f', woodL: '#e9c48f',
  sky: '#9cc4d6', skyD: '#6f9fb8', skyL: '#c9e1ea',
  teal: '#3d9f96', tealL: '#86c9be',
  yellow: '#f0c55a', yellowL: '#f7dd92',
  green: '#5f9c5c', greenL: '#a3cf92',
  red: '#d4382c', redL: '#ea7a6c',
  skin: '#ebb68f', skinD: '#c7815d', skinL: '#f7d4b4',
  lav: 'rgba(104,112,214,0.7)', lavS: 'rgba(104,112,214,0.42)',
  navy: '#0c0d1c', navy2: '#15173a', peri: '#c8d0f0', periD: '#7c86c4', periS: 'rgba(150,164,230,0.20)',
  cyan: '#52d6c4', mag: '#e0368f', glow: '#5de37a', white: '#f4f6ff',
};
const RAINBOW = ['#f0d042', '#e050b8', '#46cde0', '#7ad866', '#a47ef0'];
const MONO = 'Consolas, "Cascadia Mono", Menlo, "DejaVu Sans Mono", "Courier New", monospace';   // Windows first, then macOS / Linux

// ---------------------------------------------------------------------
//  geometry
// ---------------------------------------------------------------------
function ellipsePts(cx, cy, rx, ry, rot = 0, n = 64, a0 = 0, a1 = TAU) {
  const P = [], c = Math.cos(rot), s = Math.sin(rot), full = Math.abs(a1 - a0 - TAU) < 1e-6;
  for (let i = 0; i < n; i++) {
    const a = a0 + (a1 - a0) * i / (full ? n : n - 1);
    const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
    P.push([cx + x * c - y * s, cy + x * s + y * c]);
  }
  return P;
}
function rrectPts(x, y, w, h, r, n = 6) {
  r = Math.min(r, w / 2, h / 2);
  const P = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];

  return P;
}
function arcPts(cx, cy, r, a0, a1, n = 18, sy = 1) {
  const P = [];
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * sy]); }
  return P;
}
function xform(P, tx, ty, rot = 0, sx = 1, sy = sx) {
  const c = Math.cos(rot), s = Math.sin(rot);
  return P.map(([x, y]) => [tx + x * sx * c - y * sy * s, ty + x * sx * s + y * sy * c]);
}
function bbox(P, pad = 0) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [x, y] of P) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

}
function resample(P, closed, step) {
  const out = [], n = P.length, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const a = P[i], b = P[(i + 1) % n], k = Math.max(1, Math.ceil(dist(a, b) / step));
    for (let j = 0; j < k; j++) out.push([a[0] + (b[0] - a[0]) * j / k, a[1] + (b[1] - a[1]) * j / k]);

}
function pathLen(P) { let L = 0; for (let i = 1; i < P.length; i++) L += dist(P[i - 1], P[i]); return L; }

  let want = pathLen(P) * clamp(frac);

  for (let i = 1; i < P.length; i++) {
    const d = dist(P[i - 1], P[i]);
    if (want >= d) { out.push(P[i]); want -= d; }
    else { const k = want / (d || 1); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break; }

}
function pointAt(P, frac) { const S = subPath(P, frac); return S[S.length - 1]; }

// ---------------------------------------------------------------------
//  drawing kit — boil, sketchy lines, hatching, stipple, pencil, grain
// ---------------------------------------------------------------------
// smooth hand wobble along the normal; reseeded every boil step
function wobble(P, closed, amt, key, step = 7) {
  const Q = resample(P, closed, step), n = Q.length;
  const R = RNG('wob', key, B);
  const f1 = R.r(0.012, 0.03), f2 = R.r(0.05, 0.1), p1 = R.r(0, TAU), p2 = R.r(0, TAU);
  const sx = R.n(amt * 0.5), sy = R.n(amt * 0.5);
  const out = new Array(n); let s = 0;
  for (let i = 0; i < n; i++) {
    const a = Q[closed ? (i - 1 + n) % n : Math.max(0, i - 1)], b = Q[closed ? (i + 1) % n : Math.min(n - 1, i + 1)];
    const nx = a[1] - b[1], ny = b[0] - a[0], l = Math.hypot(nx, ny) || 1;
    if (i) s += dist(Q[i - 1], Q[i]);
    const o = amt * (0.75 * Math.sin(s * f1 + p1) + 0.35 * Math.sin(s * f2 + p2));
    out[i] = [Q[i][0] + nx / l * o + sx, Q[i][1] + ny / l * o + sy];
  }

}
function trace(P, closed) {
  ctx.beginPath();
  const n = P.length; if (n < 2) return;
  if (closed) {
    ctx.moveTo((P[n - 1][0] + P[0][0]) / 2, (P[n - 1][1] + P[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  } else {
    ctx.moveTo(P[0][0], P[0][1]);
    for (let i = 1; i < n - 1; i++) { const p = P[i], q = P[i + 1]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.lineTo(P[n - 1][0], P[n - 1][1]);
  }

// sketchy stroke. o: closed, color, w, amt, key, alpha, frac (write-on), double
function ink(P, o = {}) {
  const closed = !!o.closed, key = o.key ?? 'ink';
  let Q = o.raw ? P : wobble(P, closed, o.amt ?? 1.8, key);
  let cl = closed;
  if (o.frac != null && o.frac < 1) { if (o.frac <= 0) return Q; Q = subPath(closed ? [...Q, Q[0]] : Q, o.frac); cl = false; }
  ctx.strokeStyle = o.color || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = o.alpha ?? 1;

    let Q2 = wobble(P, closed, (o.amt ?? 1.8) * 1.6 + 0.8, key + '~');
    if (!cl && closed) Q2 = subPath([...Q2, Q2[0]], o.frac ?? 1);
    ctx.lineWidth = (o.w ?? 3) * 0.4; ctx.globalAlpha = (o.alpha ?? 1) * 0.55; trace(Q2, cl); ctx.stroke();

}

function paint(P, o = {}) {
  const key = o.key || 'paint';
  const Q = o.raw ? P : wobble(P, true, o.amt ?? 1.6, key);
  ctx.save();
  trace(Q, true);
  if (o.fill) { ctx.globalAlpha = o.fillAl ?? 1; ctx.fillStyle = o.fill; ctx.fill(); ctx.globalAlpha = 1; }
  if (o.tex) { ctx.clip(); const bb = bbox(Q, 6); o.tex.forEach((t, i) => texture(bb, { key: key + ':' + i, ...t })); }
  ctx.restore();
  if (o.line !== false) {
    ctx.strokeStyle = o.line || C.ink; ctx.lineWidth = o.w ?? 3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.lineAl ?? 1; trace(Q, true); ctx.stroke(); ctx.globalAlpha = 1;
  }

}
function texture(bb, t) {

  else if (t.k === 'cross') { hatch(bb, t); hatch(bb, { ...t, a: (t.a ?? 0.7) + (t.a2 ?? 1.25), key: t.key + 'x' }); }

// parallel hatching inside current clip. t: a angle, gap, c, w, al, dash [min,max], skip, dens(x,y)
function hatch(bb, t) {

  const cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2, rad = Math.hypot(bb.x1 - bb.x0, bb.y1 - bb.y0) / 2 + 4;
  const ca = Math.cos(a), sa = Math.sin(a), dens = t.dens, jit = t.jit ?? 0.9, dash = t.dash;

      const mu = (u + u2) / 2, mx = cx + ca * mu - sa * dd, my = cy + sa * mu + ca * dd, p = S.f();

// colored-pencil diagonal strokes
function pencil(bb, t) {

  const a = t.a ?? -0.95, L = t.len ?? 14, dens = t.dens;
  ctx.beginPath();

    const x = S.r(bb.x0, bb.x1), y = S.r(bb.y0, bb.y1), p = S.f(), aa = a + S.n(0.22), l = L * (0.5 + S.f() * 0.7);

  }

// square stipple dots
function stipple(bb, t) {

// screen-space paper grain, reseeded with the boil
function grain(o = {}) {

  ctx.fillStyle = o.dark || 'rgba(70,45,25,0.13)'; ctx.beginPath();
  for (let i = 0; i < n; i++) ctx.rect(R.r(0, W), R.r(0, H), 1.7, 1.7);
  ctx.fill();

// ---------------------------------------------------------------------
//  construction lines, rulers, sparks, bursts, rainbow contours
// ---------------------------------------------------------------------
function construct(cx, cy, r, o = {}) {

function ruler(x1, y1, x2, y2, o = {}) {

// glowing radial spark (dark world)
function sparkBurst(cx, cy, r, o = {}) {

// ---------------------------------------------------------------------
//  THE HERO: a terracotta dot with a cream asterisk, eyes, a mouth; arms and legs when it needs to act.
//  o: key, mood ('calm' | 'wow' | 'happy' | 'puzzled'), look [dx, dy] (-1..1), sx, sy (squash), rot,
//     legs (bool), step (-1..1 stride), arms [leftAngle, rightAngle] (radians up from horizontal; null = none)
//  Sets SPARK_AT (the hero's screen spot) for tools/review.
// ---------------------------------------------------------------------
function doodleHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero', mood = o.mood ?? 'calm', lw = Math.max(3, r * 0.065);
  SPARK_AT = toScreen(x, y);
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot ?? 0);
  if (o.legs) {
    const st = o.step ?? 0;
    for (const s of [-1, 1]) {
      const hip = [s * r * 0.32, r * 0.85], kick = s * st * r * 0.22, foot = [s * r * 0.36 + kick, r * 1.42 - Math.max(0, s * st) * r * 0.1];
      gline([hip, foot], { w: lw, key: key + 'leg' + s, amp: 0.8, second: false, step: 8 });
      gline([foot, [foot[0] + s * r * 0.22, foot[1] + 2]], { w: lw * 1.25, key: key + 'ft' + s, amp: 0.5, second: false, step: 6 });
    }
  }
  if (o.arms) [-1, 1].forEach((s, i) => {
    const ang = o.arms[i]; if (ang == null) return;
    const sh = [s * r * 0.9, r * 0.15], L = r * 0.85;
    const el = [sh[0] + s * L * 0.5 * Math.cos(ang * 0.6), sh[1] - L * 0.5 * Math.sin(ang * 0.6)], hd = [sh[0] + s * L * Math.cos(ang), sh[1] - L * Math.sin(ang)];
    gline([sh, el, hd], { w: lw, key: key + 'arm' + s, amp: 0.8, second: false, step: 8 });
    gline(loopPts(hd[0], hd[1], r * 0.09, r * 0.09, 0.1), { w: lw * 0.8, key: key + 'hd' + s, amp: 0.4, second: false, step: 5 });
  });
  ctx.scale(o.sx ?? 1, o.sy ?? 1);
  const body = loopPts(0, 0, r, r, 0, 0, 40);
  gfill(body, SK.terra, { off: [r * 0.06, r * 0.05], key: key + 'f' });
  litHatch(body, { ang: -0.85, gap: Math.max(5, r * 0.08), col: SK.terraD, w: Math.max(1.6, r * 0.03), a: 0.85, key: key + 'h' });
  gline(loopPts(0, 0, r, r, 0.08), { w: lw, key: key + 'o' });
  for (let i = 0; i < 8; i++) {                                                // the cream asterisk on its crown
    const an = i / 8 * TAU + 0.2, r0 = r * 0.04, r1 = r * 0.19, cy = -r * 0.5;
    gline([[Math.cos(an) * r0, cy + Math.sin(an) * r0], [Math.cos(an) * r1, cy + Math.sin(an) * r1]], { w: r * 0.065, col: SK.cream, key: key + 'a' + i, amp: 0.4, second: false, step: 6 });
  }
  const [lx, ly] = o.look ?? [0, 0], blink = mood !== 'wow' && (B + hash(key)) % 37 === 0;
  for (const s of [-1, 1]) {
    const ex = s * r * 0.3 + lx * r * 0.07, ey = r * 0.06 + ly * r * 0.07;
    if (blink) gline([[ex - r * 0.09, ey], [ex + r * 0.09, ey]], { w: lw * 0.9, key: key + 'bl' + s, amp: 0.3, second: false, step: 6 });
    else if (mood === 'happy') gline([[ex - r * 0.09, ey + r * 0.03], [ex, ey - r * 0.06], [ex + r * 0.09, ey + r * 0.03]], { w: lw * 0.9, key: key + 'hp' + s, amp: 0.3, second: false, step: 6 });
    else {
      ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.085, r * (mood === 'wow' ? 0.15 : 0.12), 0, 0, TAU); ctx.fill();
      ctx.fillStyle = SK.cream; ctx.beginPath(); ctx.arc(ex - r * 0.025, ey - r * 0.045, r * 0.028, 0, TAU); ctx.fill();
    }
  }
  if (mood === 'puzzled') gline([[r * 0.18, -r * 0.16], [r * 0.42, -r * 0.24]], { w: lw * 0.8, key: key + 'brow', amp: 0.4, second: false, step: 6 });
  const my = r * 0.4;
  if (mood === 'wow') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(0, my + r * 0.02, r * 0.08, r * 0.1, 0, 0, TAU); ctx.fill(); }
  else if (mood === 'happy') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.moveTo(-r * 0.2, my - r * 0.05); ctx.quadraticCurveTo(0, my + r * 0.3, r * 0.2, my - r * 0.05); ctx.closePath(); ctx.fill(); }
  else if (mood === 'puzzled') gline([[-r * 0.16, my], [-r * 0.05, my - r * 0.04], [r * 0.06, my + r * 0.03], [r * 0.16, my - r * 0.02]], { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  else gline(arcPts(0, my - r * 0.12, r * 0.16, Math.PI * 0.2, Math.PI * 0.8, 8), { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  ctx.restore();
  return body;
}

// ---------------------------------------------------------------------
//  CAPTIONS: the lettering is the narrator. Drawn after the camera (DEFER), at screen size.
//  pageTag(str)                 a marker label on masking tape, top left, written on at the era's start
//  pageCaption(lines, hi, o)    1–2 hand-lettered lines centred on CX, written on letter by letter;
//                               hi = [[lineIndex, 'word'], ...] gets a highlighter swipe once the line is down
// ---------------------------------------------------------------------
function pageTagDraw(str) {
  const size = 70, w = letterW(str, size, 'marker'), x = 84, y = 340;
  tapeStrip(x + w / 2, y - size * 0.3, w + 70, -0.03, 'tagtape' + str, size * 1.15);
  const [x0, x1] = handLetter(str, x, y, size, { face: 'marker', align: 'left', reveal: ev(E0 + 0.1, 0.3), key: 'tag' + str, jit: 0.7 });
  underline(x0, x1, y + 20, { col: SK.red, w: 5, key: 'tagu' + str, part: ev(E0 + 0.4, 0.2) });
}
function pageCaptionDraw(lines, hi = [], o = {}) {
  const size = o.size ?? 80, y0 = o.y ?? 1330, lh = size * 1.12, t0 = E0 + (o.at ?? 0.35);
  lines.forEach((line, li) => {
    const y = y0 + li * lh, font = skFont(size, 'hand'), xs = glyphX(line, font), x0 = CX - xs[xs.length - 1] / 2;
    for (const [hl, word] of hi) if (hl === li) { const k = line.indexOf(word); if (k >= 0) highlight(x0 + xs[k], x0 + xs[k + word.length], y - size * 0.28, size * 0.55, ev(t0 + 0.5 + li * 0.25, 0.25), { key: 'caph' + li + line }); }
    handLetter(line, CX, y, size, { reveal: ev(t0 + li * 0.25, 0.4), key: 'cap' + li + line });
  });
}
const pageTag = (str) => { const f = () => pageTagDraw(str); if (DEFER) DEFER.push(f); else f(); };
const pageCaption = (lines, hi, o) => { const f = () => pageCaptionDraw(lines, hi, o); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the renderer's hooks (kit/morph.js). A morph happens on the bare page.
// =====================================================================
const STYLE = {
  name: 'sketchbook',
  paper: SK.paper,
  backdrop(c) {   // the page, washed toward colour c (c = the paper itself at the heart of a morph)
    fillAll(c);
    ctx.save(); screen(); ctx.drawImage(pageTex('dots'), -SK_M, -SK_M); ctx.restore();
  },
  window(P, key, src) {   // the world seen through a graphite outline, lifted off the page by a soft smudge shadow
    ctx.save();
    ctx.shadowColor = 'rgba(70,64,58,0.42)'; ctx.shadowBlur = 26; ctx.shadowOffsetX = 10; ctx.shadowOffsetY = 14;
    trace(P, true); ctx.fillStyle = SK.paper; ctx.fill();
    ctx.restore();
    ctx.save(); trace(P, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    gpencil(P, { closed: true, w: 3, a: 0.6, amp: 3.2, key: key + 'c', step: 14 });
    gline(P, { closed: true, w: 5.5, key: key + 'rim', step: 14 });
  },
  blob(P, c, key) {   // the shape mid-morph: a colour scribble inside a graphite outline
    gfill(P, c, { a: 0.3, off: [6, 5], key: key + 'f' });
    scribbleFill(P, c, { key: key + 's', gap: 12, w: 4, base: 0.25 });
    gpencil(P, { closed: true, w: 2.6, a: 0.7, amp: 3, key: key + 'c' });
    gline(P, { closed: true, w: 5.5, key: key + 'o' });
  },
  hero(x, y, r, o) { doodleHero(x, y, r * 0.6, { ...o, key: o.key }); },
  heroColor: SK.terra,
  heroPts: (x, y, r) => ellipsePts(x, y, r * 0.6, r * 0.6, 0, 96),
  post() { grain({ n: 1800, dark: 'rgba(60,56,52,0.12)', light: 'rgba(255,253,245,0.16)' }); },
};
// =====================================================================
//  SCENES — sketchbook demo. World coordinates 1080x1920 (the page); time TT on 2s; ev / popS for events.
// =====================================================================
const BULB = { x: 540, y: 600, r: 120 };
const SUN = { x: 540, y: 500, r: 140 };
// a lightbulb outline: the glass (a circle cut open at the bottom) and a neck, as one closed loop
function bulbPts(x, y, r) {
  const P = [], a0 = Math.PI / 2 - 0.6, a1 = Math.PI / 2 + 0.6 - TAU;
  for (let i = 0; i <= 36; i++) { const a = lerp(a0, a1, i / 36); P.push([x + Math.cos(a) * r, y + Math.sin(a) * r]); }
  P.push([x - 0.36 * r, y + 1.12 * r], [x - 0.34 * r, y + 1.42 * r], [x + 0.34 * r, y + 1.42 * r], [x + 0.36 * r, y + 1.12 * r]);
  return P;
}
// background life: a tiny ant walking a pencil line (legs on 2s)
function ant(x, y, s, key) {
  for (let i = 0; i < 3; i++) { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(x + (i - 1) * 11 * s, y - 6 * s, (i === 1 ? 5 : 6.5) * s, 5 * s, 0, 0, TAU); ctx.fill(); }
  const k = B % 2 ? 1 : -1;
  for (let i = 0; i < 3; i++) gline([[x + (i - 1) * 8 * s, y - 4 * s], [x + (i - 1) * 8 * s + k * (i % 2 ? 5 : -5) * s, y + 3 * s]], { w: 1.8 * s, key: key + i, amp: 0.3, second: false, step: 4 });
  gline([[x + 16 * s, y - 8 * s], [x + 24 * s, y - 16 * s]], { w: 1.6 * s, key: key + 'ant', amp: 0.3, second: false, step: 4 });
}
// background life: a paper plane looping a figure-eight in the top-right margin, its graphite trail behind it
function marginPlane(key) {
  const at = (p) => [830 + 120 * Math.sin(TAU * p), 410 + 55 * Math.sin(2 * TAU * p)];
  const p = TT / 3, trail = [];
  for (let i = 0; i <= 24; i++) trail.push(at(p - 0.35 + 0.35 * i / 24));
  ctx.save(); ctx.setLineDash([10, 12]); gpencil(trail, { key: key + 'tr', w: 2.2, a: 0.6, passes: 1, amp: 1 }); ctx.restore();
  const [x, y] = at(p), [x2, y2] = at(p + 0.01);
  paperPlane(x, y, Math.atan2(y2 - y, x2 - x), 1.25, key);
}

// ---- era 0: the idea
function sceneIdea() {
  const cu = TIMELINE.cues;
  sketchPage({ grid: 'dots' });
  // the ground line the hero stands on, and an ant walking it
  gpencil([[110, 1202], [420, 1196], [700, 1204], [960, 1198]], { key: 'ground', w: 3, a: 0.75 });
  ant(560 + 110 * TT, 1199, 1.5, 'ant');
  // margin stars that twinkle on 2s
  [[110, 560, 0], [170, 760, 1], [96, 930, 2]].forEach(([x, y, i]) => doodleStar(x, y, 24 + 7 * ((B + i) % 3 === 0), 'mstar' + i, { w: 3.4 }));
  marginPlane('mp');
  // the bulb: pencil construction, then ink, then a yellow scribble; it lights on the beat
  const P = bulbPts(BULB.x, BULB.y, BULB.r), lit = ev(cu.pop, 0.25);
  if (lit > 0) {
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU - Math.PI / 2, r0 = BULB.r * 1.25, r1 = BULB.r * (1.5 + 0.12 * ((B + i) % 2));
      if (Math.sin(a) > 0.7) continue;   // not through the neck
      gline([[BULB.x + Math.cos(a) * r0, BULB.y + Math.sin(a) * r0], [BULB.x + Math.cos(a) * r1, BULB.y + Math.sin(a) * r1]], { w: 5, key: 'ray' + i, part: lit, second: false, amp: 0.8, step: 8 });
    }
  }
  scribbleFill(P, SK.hilite, { key: 'bulbfill', part: ev(cu.fill, 0.5), gap: 12, w: 4.5, a: 0.95, base: 0.35 });
  gpencil(P, { closed: true, key: 'bulbc', w: 2.6, a: 0.7, part: ev(cu.draw, cu.ink - cu.draw) });
  gline(P, { closed: true, key: 'bulb', w: 6, part: ev(cu.ink, 0.3) });
  for (let i = 0; i < 3; i++) gline([[BULB.x - 0.4 * BULB.r, BULB.y + (1.2 + i * 0.1) * BULB.r], [BULB.x + 0.4 * BULB.r, BULB.y + (1.17 + i * 0.1) * BULB.r]], { w: 4, key: 'screw' + i, second: false, part: ev(cu.ink + 0.15 + i * 0.04, 0.1) });
  gline([[BULB.x - 0.12 * BULB.r, BULB.y + 1.12 * BULB.r], [BULB.x - 0.2 * BULB.r, BULB.y + 0.3 * BULB.r], [BULB.x, BULB.y + 0.12 * BULB.r], [BULB.x + 0.2 * BULB.r, BULB.y + 0.3 * BULB.r], [BULB.x + 0.12 * BULB.r, BULB.y + 1.12 * BULB.r]], { w: 3, key: 'filament', second: false, part: ev(cu.ink + 0.1, 0.25), col: SK.graph });
  // the pencil that draws it: follows the construction line, then scribbles, then leaves
  if (TT >= cu.draw && TT < cu.pop + 0.25) {
    let tip;
    if (TT < cu.ink) tip = writeEnd(closeP(P), ev(cu.draw, cu.ink - cu.draw));
    else if (TT < cu.fill) tip = writeEnd(closeP(P), ev(cu.ink, 0.3));
    else if (TT < cu.pop) tip = [BULB.x + 85 * Math.sin(B * 2.1), BULB.y - 70 + 140 * ev(cu.fill, 0.5)];
    else { const k = EZ.i2(ev(cu.pop, 0.25)); tip = [lerp(BULB.x + 60, 1100, k), lerp(BULB.y, 300, k)]; }
    pencilTool(tip[0], tip[1], -0.75 + 0.08 * Math.sin(B * 1.7), 1);
  }
  // the hero: puzzled, then it sees the idea and hops
  const hop = Math.sin(Math.PI * ev(cu.pop, 0.25)), sq = Math.sin(Math.PI * ev(cu.pop + 0.25, 0.17));
  const hx = 300, hy = 1044 - 60 * hop, wow = TT >= cu.pop;
  doodleHero(hx, hy, 108, { key: 'hero', legs: true, mood: wow ? 'wow' : 'puzzled', look: [0.8, -0.8], sx: 1 + 0.1 * sq - 0.05 * hop, sy: 1 - 0.1 * sq + 0.08 * hop, arms: wow ? [1.2, 1.3] : [-0.9, 0.9] });
  if (!wow) handLetter('?', hx + 80, 870 + 6 * Math.sin(B * 0.9), 96, { col: SK.graph, key: 'q', jit: 1.5 });
  else handLetter('!', hx + 90, 850 - 30 * hop, 110, { face: 'marker', col: SK.ink, key: 'bang', reveal: ev(cu.pop, 0.08) });
  if (!wow) for (let i = 0; i < 2; i++) sweat(hx - 80 - i * 14, hy - 70 + i * 8, ((TT * 1.3 + i * 0.5) % 1), 'sw' + i);
  pageTag('sketch it');
  pageCaption(['every big idea', 'starts as a doodle'], [[1, 'doodle']]);
}

// ---- era 1: the hill
function hillPts() { return [[-160, 1300], [60, 1200], [300, 1080], [520, 1012], [640, 1006], [800, 1050], [1000, 1150], [1240, 1260]]; }
function sceneHill() {
  const cu = TIMELINE.cues;
  sketchPage({ grid: 'dots' });
  // a cloud drifting, birds crossing on 2s
  const cx = 140 + 30 * (TT - 3), cy0 = 80;
  gpencil(xform([[cx - 70, 400], ...arcPts(cx - 40, 390, 32, Math.PI, TAU * 0.86, 8), ...arcPts(cx + 10, 372, 40, Math.PI * 1.1, TAU * 0.98, 9), ...arcPts(cx + 60, 392, 28, Math.PI * 1.3, TAU * 1.1, 7), [cx + 90, 404], [cx - 70, 404]], 0, cy0), { key: 'cloud', w: 3, a: 0.75 });
  for (let i = 0; i < 3; i++) doodleBird(1000 - 100 * (TT - 3) + i * 64, 650 + i * 34 - (i % 2) * 16, 1.3 - i * 0.2, (B + i) % 2, 'bird' + i);
  // the sun (the bridge's counterpart): a yellow scribble, inked, rays written on and turning
  const SP0 = ellipsePts(SUN.x, SUN.y, SUN.r, SUN.r, 0, 64);
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + TT * 0.25, r0 = SUN.r * 1.18, r1 = SUN.r * (1.42 + 0.1 * ((B + i) % 2));
    gline([[SUN.x + Math.cos(a) * r0, SUN.y + Math.sin(a) * r0], [SUN.x + Math.cos(a) * r1, SUN.y + Math.sin(a) * r1]], { w: 5, key: 'sray' + i, part: ev(cu.rays + i * 0.02, 0.2), second: false, amp: 0.8, step: 8 });
  }
  scribbleFill(SP0, SK.hilite, { key: 'sunfill', gap: 12, w: 4.5, a: 0.95, base: 0.35 });
  gpencil(SP0, { closed: true, key: 'sunc', w: 2.6, a: 0.6 });
  gline(loopPts(SUN.x, SUN.y, SUN.r, SUN.r, 0.06), { key: 'sun', w: 6 });
  // a far hill in graphite, the near hill in ink with hatching on its shady side
  gpencil([[-160, 1150], [120, 1040], [260, 1010], [420, 1060], [560, 1120]], { key: 'farhill', w: 2.6, a: 0.6 });
  const HP = hillPts();
  const ridge = HP.filter(([x]) => x >= 520), band = [...ridge, ...ridge.slice().reverse().map(([x, y]) => [x - 30, y + 120])];
  ctx.save(); gclip(band);
  ghatch(480, 990, 1240, 1400, { ang: -0.9, gap: 9, col: SK.graph, w: 2, a: 0.45, key: 'hillh' }); ctx.restore();
  gline(HP, { key: 'hill', w: 6 });
  // a path up the hill (dashed graphite), a house and a tree written on
  ctx.save(); ctx.setLineDash([14, 14]); gpencil([[120, 1300], [260, 1220], [380, 1160], [480, 1090], [570, 1040]], { key: 'path', w: 3, a: 0.7, part: ev(cu.house - 0.25, 0.5) }); ctx.restore();
  const hp = ev(cu.house, 0.5), hx = 170, hy = 1170;
  if (hp > 0) gfill([[hx - 60, hy], [hx - 60, hy - 86], [hx, hy - 146], [hx + 60, hy - 86], [hx + 60, hy]], SK.paper, { off: [0, 0], key: 'hfill', a: clamp(hp * 2) });
  gline([[hx - 60, hy], [hx - 60, hy - 90], [hx + 60, hy - 90], [hx + 60, hy]], { key: 'hw', w: 4.5, part: seg(hp, 0, 0.5) });
  gline([[hx - 78, hy - 84], [hx, hy - 150], [hx + 78, hy - 84]], { key: 'hr', w: 4.5, part: seg(hp, 0.4, 0.8) });
  gline([[hx - 12, hy], [hx - 12, hy - 46], [hx + 14, hy - 46], [hx + 14, hy]], { key: 'hd', w: 3.5, part: seg(hp, 0.7, 1), second: false });
  if (hp >= 1) {   // smoke from the chimney, curling on 2s
    gline([[hx + 40, hy - 118], [hx + 40, hy - 150], [hx + 54, hy - 150], [hx + 54, hy - 107]], { key: 'chim', w: 3.5, second: false });
    const sm = []; for (let k = 0; k <= 10; k++) sm.push([hx + 47 + Math.sin(k * 0.9 - TT * 5) * 10, hy - 160 - k * 12]);
    gpencil(sm, { key: 'smoke', w: 2.6, a: 0.6 });
  }
  const tp = ev(cu.tree, 0.5), tx = 830, ty = 1092, sway = 0.04 * Math.sin(TT * 3);
  gline([[tx - 6, ty], [tx - 4, ty - 90]], { key: 'trunk1', w: 4.5, part: seg(tp, 0, 0.3), second: false });
  gline([[tx + 10, ty], [tx + 8, ty - 90]], { key: 'trunk2', w: 4.5, part: seg(tp, 0, 0.3), second: false });
  ctx.save(); ctx.translate(tx, ty - 90); ctx.rotate(sway);
  const crown = [...arcPts(-40, -40, 44, Math.PI * 0.6, Math.PI * 1.5, 8), ...arcPts(10, -78, 46, Math.PI * 1.1, Math.PI * 2.0, 8), ...arcPts(50, -30, 44, Math.PI * 1.5, Math.PI * 2.5, 8), [0, 8], [-40, 4]];
  if (tp > 0.3) gfill(crown, SK.paper, { off: [0, 0], key: 'crownf', a: 0.9 });
  litHatch(crown, { ang: -0.6, gap: 8, col: SK.graph, w: 2, a: tp >= 1 ? 0.5 : 0, key: 'crownh', lx: 0.2, ly: 0.3 });
  gline(crown, { key: 'crown', w: 4.5, part: seg(tp, 0.3, 1), closed: true });
  ctx.restore();
  // the hero on the hilltop: waves at the sun, hops on the beat
  const hop = Math.max(Math.sin(Math.PI * ev(cu.hop1, 0.25)), Math.sin(Math.PI * ev(cu.hop2, 0.25)));
  const wave = 1.0 + 0.5 * ((B % 4) < 2 ? 1 : -1);
  doodleHero(600, 880 - 50 * hop, 90, { key: 'hero', legs: true, mood: 'happy', look: [-0.4, -1], step: 0, sy: 1 + 0.06 * hop, sx: 1 - 0.04 * hop, arms: [-0.7, wave] });
  if (hop > 0) for (let i = 0; i < 2; i++) gline([[540 + i * 120, 1000], [528 + i * 144, 1012]], { w: 3, key: 'dust' + i, second: false, a: hop });
  pageTag('grow it');
  pageCaption(['then it lights up', 'the whole page'], [[1, 'whole page']]);
}

//  ERAS, CAMERAS, BRIDGES — sketchbook demo (read by kit/morph.js)

const ERA_BG = ['#f2ead8', '#efe3c4'];
function pieceCam(era, t) {
  if (era === 0) return push(t, 1.9, 2.4, { z: 1.2, p: [540, 700], to: [540, 760] });                    // lean in on the idea

  [['D5', 0], ['Fs5', E16], ['A5', E8]].forEach(([n, dt], i) => pluck(cu.pop + dt, nz(n), 0.22 - i * 0.04, -0.1 + i * 0.1, 0.5, 4200, 0.4));   // the idea lights
  pad(3.0, 6.05, ['D2', 'A2', 'Fs3', 'E4'], 0.045, { cut: 800, att: 0.3, rel: 0.3, send: 0.4 });

  to = 's';
  for (let i = 0; i < 12; i++) noiseHit(cu.draw + i * E16, 0.07, 'bandpass', 3600 + (i % 3) * 300, 2, 0.05, -0.2);                      // pencil construction
  for (let i = 0; i < 8; i++) noiseHit(cu.fill + i * E16 / 2, 0.05, 'bandpass', 2600, 1.4, 0.06, 0.1);                                  // the scribble fill
  sweep(2.5, 3.0, 0.012, 500, 2800, 0);                                                                                                 // into the morph
  chime(3.0, [nz('D5'), nz('A5'), nz('E6')], 0.07, 0);                                                                                  // the sun
  for (let i = 0; i < 4; i++) blip(3.75 + i * E8, 2200 + (i % 2) * 400, 1800, 0.03, 0.025, 0.3);                                       // birds
  // =====================================================================
  //  kit/score-tail.js — render, fold the tail over the loop point, loudness stage

  // =====================================================================
