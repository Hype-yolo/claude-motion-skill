<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#eee9dc}canvas{display:block;width:100vw;height:100vh;object-fit:contain}button{position:fixed;bottom:16px;left:20px}</style><canvas width="1280" height="720"></canvas><button>播放预览（无声）</button><script type="module">import * as s from './scene.js';await s.ready;await document.fonts.ready;const c=document.querySelector('canvas'),g=c.getContext('2d');window.DUR=s.duration;window.CAPTURE=c;window.render=t=>s.render(g,t);window.audioWav=s.audioWav;window.READY=true;render(0);let play=false,st=0;document.querySelector('button').onclick=()=>{play=!play;st=performance.now();tick()};function tick(){if(!play)return;let t=(performance.now()-st)/1000;if(t>=DUR){play=false;t=DUR}render(t);if(play)requestAnimationFrame(tick)}</script>
