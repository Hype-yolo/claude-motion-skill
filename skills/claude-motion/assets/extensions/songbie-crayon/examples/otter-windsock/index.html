<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River Weather Station</title><style>html,body{margin:0;background:#e8e0cd;color:#685749;font:14px system-ui}main{max-width:1280px;margin:3vh auto}canvas{width:100%;display:block}footer{display:flex;gap:16px;align-items:center;padding:16px}input{flex:1}button{font:inherit}</style><main><canvas width="1280" height="720"></canvas><footer><button>Pause</button><input type="range" min="0" max="17.999" step=".01" value="0"><span>0.0 / 18.0 s</span></footer></main><script type="module">import {render,duration} from './scene.js';const c=document.querySelector('canvas'),g=c.getContext('2d'),slider=document.querySelector('input'),button=document.querySelector('button'),label=document.querySelector('span');let playing=true,t=0,last=0;button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play'};slider.oninput=()=>{t=+slider.value;render(g,t)};function loop(now){if(playing){t=(t+Math.min((now-last)/1000,.1))%duration;slider.value=t;}render(g,t);label.textContent=t.toFixed(1)+' / 18.0 s';last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></html>
