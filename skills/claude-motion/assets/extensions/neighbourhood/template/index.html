<!doctype html><meta charset="utf-8"><title>Motion preview</title><style>html,body{margin:0;background:#131518;height:100%;overflow:hidden}canvas{width:100vw;height:100vh;object-fit:contain}#scrub{position:fixed;bottom:10px;left:5%;width:90%;opacity:.4}</style><canvas id="capture" width="1280" height="720"></canvas><input id="scrub" type="range" min="0" max="18" step=".01"><script type="module">import{render,ready}from'./scene.js';await ready;window.CAPTURE=document.querySelector('canvas');window.DUR=18;window.render=t=>render(CAPTURE.getContext('2d'),t);window.READY=true;let t0=performance.now();const scrub=document.querySelector('input');scrub.oninput=()=>{t0=performance.now()-scrub.value*1000};function frame(now){const t=((now-t0)/1000)%18;render(CAPTURE.getContext('2d'),t);scrub.value=t;requestAnimationFrame(frame)}if(!new URLSearchParams(location.search).has('export'))requestAnimationFrame(frame);</script>
