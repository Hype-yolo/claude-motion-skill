<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>书页里的小港口</title><style>html,body{margin:0;background:#101820;color:#decda8;font:14px system-ui}main{max-width:1280;margin:2vh auto}canvas{width:100%;height:auto;display:block}footer{padding:14px;display:flex;gap:16px;align-items:center}input{flex:1}button{border:1px solid #736b58;border-radius:4px;background:#253039;color:#e8dcbf;padding:8px 14px}</style><main><canvas width="1280" height="720"></canvas><footer><button id="play">暂停</button><input id="seek" type="range" min="0" max="18" value="0" step="0.01"><span id="time">0.00 / 18</span></footer></main><script type="module">import{render,duration}from './scene.js';const g=document.querySelector('canvas').getContext('2d'),seek=document.querySelector('#seek'),play=document.querySelector('#play'),label=document.querySelector('#time');let t=0,last=performance.now(),playing=true;play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};seek.oninput=()=>{t=+seek.value;playing=false;play.textContent='播放'};function tick(now){if(playing)t=(t+(now-last)/1000)%duration;last=now;g.reset();render(g,t);seek.value=t;label.textContent=t.toFixed(2)+' / 18';requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></html>
