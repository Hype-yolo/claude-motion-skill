<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Inter Tight"; src: url(fonts/InterTightwght.ttf); font-weight: 100 900; }
@font-face { font-family: "Noto Sans SC"; src: url(fonts/NotoSansSCwght.ttf); font-weight: 100 900; }
@font-face { font-family: "Noto Sans JP"; src: url(fonts/NotoSansJPwght.ttf); font-weight: 100 900; }
@font-face { font-family: "DM Mono"; src: url(fonts/DMMono-Medium.ttf); font-weight: 500; }
html,body { margin:0; background:#000; }
canvas { display:block; }
</style></head>
<body>
<canvas id="c" width="2880" height="2160"></canvas>
<script src="edl.js"></script>
<script src="engine.js"></script>
<script src="poses/base.js"></script>
<script src="poses/ath.js"></script>
<script src="poses/aqua.js"></script>
<script src="poses/ball.js"></script>
<script src="poses/combat.js"></script>
<script src="poses/power.js"></script>
<script src="poses/nature.js"></script>
<script src="poses/asia.js"></script>
<script src="scenes.js"></script>
<script>
// 4:3 封面 2880×2160：上面 8×4 方格（象形图 + 核心图形纹样 + 红日），下面墨色标题区
// cover.html?lang=ej → 英日版；默认中文版
const EJ = new URLSearchParams(location.search).get('lang') === 'ej';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const CW = 2880, CH = 2160, S = 360, COLS = 8, ROWS = 4;
const { PAL, mix, rgba, F } = G;

// 格子：p = 象形图（姿势名 + 色系），m = 纹样格，sun = 红日
const T = [
  ['p', 'sprint', 'red'],   ['m', 4, 'purple'], ['p', 'free', 'purple'],     ['p', 'football', 'gold'],   ['m', 8, 'ochre'],   ['p', 'judo', 'ochre'],       ['p', 'taekwondo', 'ochre'], ['m', 3, 'green'],
  ['m', 11, 'gold'],        ['p', 'highjump', 'red'], ['p', 'basketball', 'gold'], ['sun'],                   ['sun2'],            ['p', 'archery', 'ink'],      ['m', 5, 'red'],             ['p', 'surfing', 'green'],
  ['p', 'badminton', 'gold'], ['m', 7, 'ochre'],    ['p', 'weightlifting', 'ink'], ['sun3'],                  ['sun4'],            ['p', 'cyc_road', 'green'],   ['p', 'fencing', 'ochre'],   ['m', 6, 'purple'],
  ['p', 'diving', 'purple'], ['p', 'skate', 'gold'], ['m', 12, 'green'],        ['p', 'breaking', 'red'],    ['p', 'climbing', 'ochre'], ['m', 9, 'red'],        ['p', 'esports', 'purple'],  ['p', 'equestrian', 'green'],
];

function tile(i, j, t) {
  const x = i * S, y = j * S;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, S, S); ctx.clip();
  if (t[0] === 'p') {
    const pk = t[2], P = PAL[pk];
    const bg = P.t[(i + j) % 2 ? 2 : 1];
    ctx.fillStyle = bg; ctx.fillRect(x, y, S, S);
    const def = POSES[t[1]];
    const C = G.colorsFor(pk, bg);
    ctx.save(); ctx.translate(x + S / 2, y + S * 0.52); const U = S * 0.62; ctx.scale(U, U);
    G.drawFigUnits(ctx, def, def.iconU ?? 1, C);
    ctx.restore();
  } else if (t[0] === 'm') {
    const P = PAL[t[2]], r = G.rng(i * 31 + j * 7 + t[1]);
    G.motif(ctx, t[1], x, y, S, [P.t[1], P.t[3], P.t[4], P.t[0]], r);
  }
  ctx.restore();
}

function draw() {
  ctx.fillStyle = PAL.ink.t[0]; ctx.fillRect(0, 0, CW, CH);
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) tile(i, j, T[j * COLS + i]);
  // 中间 2×2 合成一个大红日格：红底 + 米白日轮 + 五色环
  const sx = 3 * S, sy = 1 * S;
  ctx.fillStyle = PAL.red.t[2]; ctx.fillRect(sx, sy, 2 * S, 2 * S);
  const cx = sx + S, cy = sy + S;
  const cols = ['red', 'purple', 'gold', 'green', 'ochre'];
  for (let k = 4; k >= 0; k--) { G.ring(ctx, cx, cy, 168 + k * 38, 22, k === 0 ? G.CREAM : PAL[cols[k]].t[2]); }
  G.disc(ctx, cx, cy, 136, G.CREAM);
  G.disc(ctx, cx, cy, 108, PAL.red.t[2]);
  ctx.font = F.en(900, 96); ctx.letterSpacing = '-3px'; ctx.textAlign = 'center'; ctx.fillStyle = G.CREAM;
  ctx.fillText('43', cx, cy + 34);

  // 整行错位：把第 1 行和第 4 行轻轻错开（官方核心图形的标志）
  // 错开后露出的半格补一个纹样格，不做循环（否则两端会出现同一个人）
  const shift = (j, dx, kind, pk) => {
    const tmp = G.canvas(CW, S); tmp.getContext('2d').drawImage(cv, 0, j * S, CW, S, 0, 0, CW, S);
    const gx = dx < 0 ? CW + dx : 0;
    ctx.save(); ctx.beginPath(); ctx.rect(gx, j * S, Math.abs(dx), S); ctx.clip();
    const P = PAL[pk]; G.motif(ctx, kind, gx - (dx < 0 ? 0 : S / 2), j * S, S, [P.t[1], P.t[3], P.t[4], P.t[0]], G.rng(j + 99));
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.rect(dx < 0 ? 0 : dx, j * S, CW - Math.abs(dx), S); ctx.clip();
    ctx.drawImage(tmp, dx, j * S); ctx.restore();
  };
  shift(0, -S / 2, 1, 'gold'); shift(3, S / 2, 0, 'red');

  // 标题区
  const ty = ROWS * S; // 1440
  ctx.fillStyle = PAL.ink.t[0]; ctx.fillRect(0, ty, CW, CH - ty);
  // 五色条
  cols.forEach((k, n) => { ctx.fillStyle = PAL[k].t[2]; ctx.fillRect(n * CW / 5, ty, CW / 5, 18); });
  const L = 150;
  ctx.textAlign = 'left';
  ctx.font = F.mono(40); ctx.letterSpacing = '12px'; ctx.fillStyle = rgba(G.CREAM, 0.72);
  ctx.fillText('THE 20TH ASIAN GAMES  ·  2026.9.19 — 10.4', L, ty + 120);
  ctx.font = F.en(900, 250); ctx.letterSpacing = '-7px'; ctx.fillStyle = G.CREAM;
  ctx.fillText('AICHI-NAGOYA 2026', L - 8, ty + 370);
  // 第二行：语言版本
  if (EJ) {
    ctx.font = F.en(800, 104); ctx.letterSpacing = '-1px'; ctx.fillStyle = G.CREAM;
    ctx.fillText('ALL 43 SPORTS', L, ty + 560);
    const w = ctx.measureText('ALL 43 SPORTS').width;
    ctx.font = F.jp(900, 96); ctx.letterSpacing = '6px'; ctx.fillStyle = PAL.gold.t[2];
    ctx.fillText('全43競技を一気に', L + w + 60, ty + 558);
  } else {
    ctx.font = F.zh(900, 112); ctx.letterSpacing = '8px'; ctx.fillStyle = G.CREAM;
    ctx.fillText('亚运会 43 个大项', L, ty + 560);
    const w = ctx.measureText('亚运会 43 个大项').width;
    ctx.fillStyle = PAL.gold.t[2];
    ctx.fillText('一口气看完', L + w + 50, ty + 560);
  }
  // 右下角小红日
  G.disc(ctx, CW - 230, ty + 460, 72, PAL.red.t[2]);
  ctx.font = F.mono(30); ctx.letterSpacing = '8px'; ctx.fillStyle = rgba(G.CREAM, 0.6); ctx.textAlign = 'right';
  ctx.fillText('IMAGINE ONE ASIA', CW - 150, ty + 640);
}

Promise.all(['900 40px "Inter Tight"', '800 40px "Inter Tight"', '900 40px "Noto Sans SC"', '900 40px "Noto Sans JP"', '500 20px "DM Mono"']
  .map((f) => document.fonts.load(f, 'Aa亚运会个大项一口气看完全競技を気に'))).then(() => { draw(); window.READY = true; });
</script>
</body></html>
