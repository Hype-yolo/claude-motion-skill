<!doctype html><html><meta charset="utf-8"><title>Paper Nocturne</title><style>body{margin:0;background:#f2e8d0}canvas{width:100vw;height:100vh;object-fit:contain;display:block}#controls{position:fixed;bottom:12px;left:35%;padding:8px;background:#eee5d6dd}input{width:25vw}</style><canvas id="frame" width="1280" height="720"></canvas><div id="controls"><button id="play">Play preview</button><input id="seek" type="range" min="0" max="18" step=".01" value="0"></div><script type="module">import * as s from './scene.js';const c=document.querySelector('canvas'),g=c.getContext('2d');window.CAPTURE=c;window.DUR=s.duration;window.render=t=>s.render(g,t);window.audioWav=s.audioWav;window.paperEvidence=()=>{const p=s.evidence.body,d=p.c.getContext('2d').getImageData(0,0,p.c.width,p.c.height).data;let holes=0,opaque=0;for(let y=Math.floor(p.c.height*.25);y<p.c.height*.75;y++)for(let x=Math.floor(p.c.width*.25);x<p.c.width*.6;x++){const a=d[(y*p.c.width+x)*4+3];if(a===0)holes++;if(a===255)opaque++;}return{interiorTransparentPixels:holes,interiorOpaquePixels:opaque,modules:s.evidence.upstream}};let playing=false,start=0,offset=0,raf;const seek=document.querySelector('#seek'),button=document.querySelector('#play');function tick(){if(!playing)return;const t=Math.min(s.duration,offset+(performance.now()-start)/1000);window.render(t);seek.value=t;if(t<s.duration)raf=requestAnimationFrame(tick);else{playing=false;button.textContent='Replay'}}button.onclick=()=>{playing=!playing;button.textContent=playing?'Pause':'Play preview';if(playing){offset=Number(seek.value);if(offset>=s.duration)offset=0;start=performance.now();tick()}else cancelAnimationFrame(raf)};seek.oninput=()=>{playing=false;cancelAnimationFrame(raf);window.render(Number(seek.value))};window.render(0);window.READY=true;</script></html>
